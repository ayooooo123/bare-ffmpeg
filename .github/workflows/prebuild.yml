name: Prebuild
on:
  workflow_dispatch:
jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: x64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: ia32
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm
            flags: -D ANDROID_STL=c++_shared
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-2022
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    # The win32 build is known-broken upstream (GPL x264 does not yet compile
    # with clang-cl on Windows). Keep it in the matrix for visibility but don't
    # let it fail the whole run / block the committed prebuilds.
    continue-on-error: ${{ matrix.platform == 'win32' }}
    steps:
      - uses: actions/checkout@v4
      # Drop any prebuilds committed to the branch so they don't get bundled
      # into this job's per-arch artifact.
      - run: rm -rf prebuilds
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: |
          sudo apt update
          sudo apt install -y nasm
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: pip3 install meson
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: brew install meson nasm llvm@20
        if: ${{ matrix.platform == 'darwin' || matrix.platform == 'ios' }}
      - run: choco upgrade llvm
        if: ${{ matrix.platform == 'win32' }}
      - run: choco install --ignore-package-exit-codes meson nasm msys2
        if: ${{ matrix.platform == 'win32' }}
      - run: pacman --noconfirm -S git make ninja pkgconf nasm
        shell: C:\tools\msys64\usr\bin\bash.exe -e {0}
        env:
          PATH: C:\tools\msys64\usr\bin
        if: ${{ matrix.platform == 'win32' }}
      - run: npm install -g bare-runtime bare-make
      - run: npm install
      - run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} -D BARE_FFMPEG_ENABLE_GPL=ON ${{ matrix.flags }}
      - run: bare-make build
      - run: bare-make install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: prebuilds/*

  # Combine the per-arch macOS builds into a single universal Mach-O.
  # Consumers that bundle with bare-pack (e.g. PearTube) resolve the macOS
  # addon from darwin-universal, so it must be a committed real binary.
  # This job uploads the fat binary as an artifact; commit-prebuilds commits
  # everything in one shot.
  darwin-universal:
    name: darwin-universal
    needs: prebuild
    if: ${{ always() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g bare-runtime
      # Start from a clean slate so previously committed prebuilds don't
      # interfere with the freshly downloaded per-arch binaries.
      - run: rm -rf prebuilds
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: prebuilds/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: prebuilds/darwin-x64
      - name: Create universal binary
        run: |
          echo "== downloaded prebuilds tree =="
          find prebuilds -type f | sort
          arm64_bin=$(find prebuilds/darwin-arm64 -name 'bare-ffmpeg.bare' | head -1)
          x64_bin=$(find prebuilds/darwin-x64 -name 'bare-ffmpeg.bare' | head -1)
          echo "arm64: $arm64_bin"
          echo "x64:   $x64_bin"
          test -n "$arm64_bin" && test -n "$x64_bin"
          mkdir -p prebuilds/darwin-universal
          lipo -create "$arm64_bin" "$x64_bin" \
            -output prebuilds/darwin-universal/bare-ffmpeg.bare
          lipo -info prebuilds/darwin-universal/bare-ffmpeg.bare
          file prebuilds/darwin-universal/bare-ffmpeg.bare
      - name: Smoke test (universal binary loads)
        run: |
          rm -rf prebuilds/darwin-arm64 prebuilds/darwin-x64
          bare -e "require('./')"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: prebuilds/darwin-universal

  # Download every per-platform artifact (including darwin-universal) and
  # commit them all to the branch in one shot.  darwin-arm64 and darwin-x64
  # are half-binaries only used to build the universal slice; drop them.
  # win32 is continue-on-error so its artifact may not exist — that's fine,
  # download-artifact with no name filter silently skips missing artifacts.
  commit-prebuilds:
    name: Commit prebuilds
    needs: [prebuild, darwin-universal]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: rm -rf prebuilds
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true
      # Remove per-arch Darwin halves; only the universal fat binary is needed.
      - run: rm -rf prebuilds/darwin-arm64 prebuilds/darwin-x64
        shell: bash
      - name: Show committed prebuilds
        run: |
          echo "=== prebuilds to commit ==="
          find prebuilds -type f | sort
          du -sh prebuilds/*/bare-ffmpeg.bare 2>/dev/null || true
      - name: Commit prebuilds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilds/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update prebuilds for all platforms [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
