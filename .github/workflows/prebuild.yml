name: Prebuild
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'peartube/**'
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: x64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: ia32
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm
            flags: -D ANDROID_STL=c++_shared
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
            flags: -D BARE_FFMPEG_ENABLE_GPL=OFF
          - os: windows-2022
            platform: win32
            arch: arm64
            flags: -D BARE_FFMPEG_ENABLE_GPL=OFF
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    # The win32 build is known-broken upstream with clang-cl in some FFmpeg/x264
    # combinations. Keep it visible, but don't block the usable prebuild commit.
    continue-on-error: ${{ matrix.platform == 'win32' }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf prebuilds
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: |
          sudo apt update
          sudo apt install -y nasm
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: pip3 install meson
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: brew install meson nasm llvm@20
        if: ${{ matrix.platform == 'darwin' || matrix.platform == 'ios' }}
      - run: choco upgrade llvm
        if: ${{ matrix.platform == 'win32' }}
      - run: choco install --ignore-package-exit-codes meson nasm msys2
        if: ${{ matrix.platform == 'win32' }}
      - run: pacman --noconfirm -S git make ninja pkgconf nasm
        shell: C:\tools\msys64\usr\bin\bash.exe -e {0}
        env:
          PATH: C:\tools\msys64\usr\bin
        if: ${{ matrix.platform == 'win32' }}
      - run: npm install -g bare-runtime bare-make
      - run: npm install
      - run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} -D CMAKE_BUILD_TYPE=MinSizeRel -D BARE_FFMPEG_ENABLE_GPL=ON ${{ matrix.flags }}
      - run: bare-make build
      - run: bare-make install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: prebuilds/*

  commit-prebuilds:
    name: commit-prebuilds
    runs-on: macos-15
    needs: prebuild
    if: ${{ always() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g bare-runtime
      - run: rm -rf prebuilds
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true
      - name: Create darwin universal prebuild
        shell: bash
        run: |
          echo "== downloaded prebuilds tree =="
          find prebuilds -type f | sort
          arm64_bin=$(find prebuilds/darwin-arm64 -name 'bare-ffmpeg.bare' | head -1)
          x64_bin=$(find prebuilds/darwin-x64 -name 'bare-ffmpeg.bare' | head -1)
          echo "darwin arm64: $arm64_bin"
          echo "darwin x64:   $x64_bin"
          test -n "$arm64_bin" && test -n "$x64_bin"
          mkdir -p prebuilds/darwin-universal
          lipo -create "$arm64_bin" "$x64_bin" \
            -output prebuilds/darwin-universal/bare-ffmpeg.bare
          cp prebuilds/darwin-universal/bare-ffmpeg.bare \
            prebuilds/darwin-universal/bare-ffmpeg.node
          lipo -info prebuilds/darwin-universal/bare-ffmpeg.bare
          file prebuilds/darwin-universal/bare-ffmpeg.bare
      - name: Smoke test host prebuild
        shell: bash
        run: bare -e "require('./')"
      - name: Commit prebuilds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilds .gitattributes
          if git diff --staged --quiet; then
            echo "No prebuild changes to commit"
          else
            git commit -m "build: add slim PearTube prebuilds [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
