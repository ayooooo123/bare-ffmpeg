name: Prebuild
on:
  workflow_dispatch:
  push:
    branches:
      - claude/bare-ffmpeg-prebuilds-bmgfay
jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: x64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: ia32
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
          - os: ubuntu-24.04
            platform: android
            arch: arm
            flags: -D ANDROID_STL=c++_shared
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-2022
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: |
          sudo apt update
          sudo apt install -y nasm
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: pip3 install meson
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: brew install meson nasm llvm@20
        if: ${{ matrix.platform == 'darwin' || matrix.platform == 'ios' }}
      - run: choco upgrade llvm
        if: ${{ matrix.platform == 'win32' }}
      - run: choco install --ignore-package-exit-codes meson nasm msys2
        if: ${{ matrix.platform == 'win32' }}
      - run: pacman --noconfirm -S git make ninja pkgconf nasm
        shell: C:\tools\msys64\usr\bin\bash.exe -e {0}
        env:
          PATH: C:\tools\msys64\usr\bin
        if: ${{ matrix.platform == 'win32' }}
      - run: npm install -g bare-runtime bare-make
      - run: npm install
      - run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} -D BARE_FFMPEG_ENABLE_GPL=ON ${{ matrix.flags }}
      - run: bare-make build
      - run: bare-make install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: prebuilds/*
  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds
  # Combine the per-arch macOS builds into a single universal Mach-O at
  # prebuilds/darwin-universal/bare-ffmpeg.node and commit it back to the
  # branch. Consumers that bundle with bare-pack (e.g. PearTube) resolve the
  # macOS addon from the darwin-universal path, so it must be a committed,
  # real binary (not an LFS pointer).
  darwin-universal:
    name: darwin-universal
    needs: prebuild
    if: ${{ always() }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g bare-runtime
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: prebuilds/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: prebuilds/darwin-x64
      - name: Create universal binary
        run: |
          mkdir -p prebuilds/darwin-universal
          lipo -create \
            prebuilds/darwin-arm64/bare-ffmpeg.node \
            prebuilds/darwin-x64/bare-ffmpeg.node \
            -output prebuilds/darwin-universal/bare-ffmpeg.node
          lipo -info prebuilds/darwin-universal/bare-ffmpeg.node
          file prebuilds/darwin-universal/bare-ffmpeg.node
      - name: Smoke test (universal binary loads)
        run: |
          rm -rf prebuilds/darwin-arm64 prebuilds/darwin-x64
          bare -e "require('./')"
      - name: Commit prebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prebuilds/darwin-universal/bare-ffmpeg.node
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: add darwin-universal prebuild [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
